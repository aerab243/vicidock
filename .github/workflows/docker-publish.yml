name: docker-publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    # Rebuild mensuel : suit les patchs de sécurité AlmaLinux/Remi
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      svn_rev:
        description: "Révision SVN VICIdial à builder (ex. 3939)"
        required: false
        default: "3939"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=v(.*),group=1
            type=sha

      - name: Build (local, sans push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          # VICIdial/Asterisk = x86_64 uniquement (pas de build ARM).
          platforms: linux/amd64
          tags: vicidock:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VICIDIAL_SVN_REV=${{ inputs.svn_rev || '3939' }}

      # Action officielle : binaire Trivy direct sur le runner (pas de pull
      # Docker Hub, pas de socket), avec acces a l'image locale vicidock:scan.
      - name: Scan Trivy (bloque si CVE critique)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vicidock:scan
          format: table
          severity: CRITICAL
          exit-code: 1

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          build-args: |
            VICIDIAL_SVN_REV=${{ inputs.svn_rev || '3939' }}
