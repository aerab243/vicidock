name: docker-publish

# Publication UNIQUEMENT sur tag de version semver : v0.1.0, v0.1.1, ...
# (docs/versions.md). La rev VICIdial vient du défaut ci-dessous ou de
# l'input dispatch. Validation rapide sur main : workflow validate.yml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      svn_rev:
        description: "Révision SVN VICIdial à tester (build + scan, SANS push)"
        required: false
        default: "3939"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  VICIDIAL_SVN_REV: "3939"

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve versions
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || { echo "Tag invalide: $GITHUB_REF_NAME (attendu vX.Y.Z)" >&2; exit 1; }
            SVN_REV="${{ env.VICIDIAL_SVN_REV }}"
          else
            SVN_REV="${{ inputs.svn_rev }}"
          fi
          [[ "$SVN_REV" =~ ^[0-9]+$ ]] \
            || { echo "svn_rev invalide: $SVN_REV" >&2; exit 1; }
          echo "tag=${GITHUB_REF_NAME} svn_rev=$SVN_REV"
          {
            echo "svn_rev=$SVN_REV"
            echo "ghcr_full=${GITHUB_REF_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.ghcr_full }}
            type=raw,value=latest
          labels: |
            vicidock.vicidial-rev=${{ steps.ver.outputs.svn_rev }}

      - name: Build (local, sans push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          # VICIdial/Asterisk = x86_64 uniquement (pas de build ARM).
          platforms: linux/amd64
          tags: vicidock:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VICIDIAL_SVN_REV=${{ steps.ver.outputs.svn_rev }}

      # Action officielle : binaire Trivy direct sur le runner (pas de pull
      # Docker Hub, pas de socket), avec acces a l'image locale vicidock:scan.
      - name: Scan Trivy (bloque si CVE critique)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vicidock:scan
          format: table
          severity: CRITICAL
          exit-code: 1

      - name: Build and push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          build-args: |
            VICIDIAL_SVN_REV=${{ steps.ver.outputs.svn_rev }}
