name: validate

# Contrôles rapides sur main (< 3 min, sans build complet).
# La publication d'images se fait uniquement sur tag (docker-publish.yml).
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install linters
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck php-cli

      - name: Shell + compose + configs
        run: |
          bash -n docker/entrypoint.sh
          bash -n docker/vicidial-perl.sh
          shellcheck -S warning docker/entrypoint.sh docker/vicidial-perl.sh
          set -a; . ./.env.example; set +a
          docker compose config >/dev/null
          python3 -c "import configparser; c = configparser.ConfigParser(); c.read('docker/supervisord.conf'); assert c.has_section('supervisorctl'); print('supervisord OK')"
          python3 -c "import configparser; m = configparser.ConfigParser(); m.read('docker/vicidock-mysql.cnf'); assert 'mysqld' in m.sections(); print('mysql cnf OK')"
          php -l docker/healthcheck.php

      - name: Dockerfile lint
        run: docker build --check -f Dockerfile .
