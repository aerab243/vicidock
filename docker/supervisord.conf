[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid
loglevel=info

[program:mariadb]
command=/usr/libexec/mariadbd --user=mysql
autorestart=true
startsecs=10
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:php-fpm]
command=/usr/sbin/php-fpm --nodaemonize
autorestart=true
startsecs=5
priority=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:httpd]
command=/usr/sbin/httpd -DFOREGROUND
autorestart=true
startsecs=10
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:asterisk]
command=/usr/sbin/asterisk -f
autorestart=true
startsecs=10
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:crond]
command=/usr/sbin/crond -n
autorestart=true
startsecs=5
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

# Daemons VICIdial gérés nativement (restart auto + logs).
# vicidial-perl.sh attend MariaDB (démarrage parallèle oblige).
# La crontab (ADMIN_keepalive_ALL.pl) reste en filet de sécurité.
[program:AST_manager_send]
command=/usr/local/bin/vicidial-perl.sh /usr/bin/perl /usr/share/astguiclient/AST_manager_send.pl
autorestart=true
startsecs=5
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:AST_manager_listen]
command=/usr/local/bin/vicidial-perl.sh /usr/bin/perl /usr/share/astguiclient/AST_manager_listen.pl
autorestart=true
startsecs=5
priority=51
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:AST_VDauto_dial]
command=/usr/local/bin/vicidial-perl.sh /usr/bin/perl /usr/share/astguiclient/AST_VDauto_dial.pl
autorestart=true
startsecs=5
priority=52
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:AST_VDadapt]
command=/usr/local/bin/vicidial-perl.sh /usr/bin/perl /usr/share/astguiclient/AST_VDadapt.pl
autorestart=true
startsecs=5
priority=53
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:AST_VDremote_agents]
command=/usr/local/bin/vicidial-perl.sh /usr/bin/perl /usr/share/astguiclient/AST_VDremote_agents.pl
autorestart=true
startsecs=5
priority=54
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

# Requis pour supervisorctl (socket local, recréé à chaque boot).
[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock
