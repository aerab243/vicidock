[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid
loglevel=info

[program:mariadb]
command=/usr/libexec/mariadbd --user=mysql
autorestart=true
startsecs=10
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:httpd]
command=/usr/sbin/httpd -DFOREGROUND
autorestart=true
startsecs=10
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:asterisk]
command=/usr/sbin/asterisk -f
autorestart=true
startsecs=10
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:crond]
command=/usr/sbin/crond -n
autorestart=true
startsecs=5
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

# Daemons VICIdial gérés nativement (restart auto + logs) : plus de screen.
# La crontab (ADMIN_keepalive_ALL.pl) reste en filet de sécurité.
[program:AST_manager_send]
command=/usr/bin/perl /usr/share/astguiclient/AST_manager_send.pl
autorestart=true
startsecs=5
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

