[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid

[program:mariadb]
command=/usr/libexec/mariadbd --user=mysql
autorestart=true
priority=10

[program:httpd]
command=/usr/sbin/httpd -DFOREGROUND
autorestart=true
priority=20

[program:asterisk]
command=/usr/sbin/asterisk -f
autorestart=true
priority=30

[program:crond]
command=/usr/sbin/crond -n
autorestart=true
priority=40

[program:vicidial]
command=/usr/local/bin/vicidial-run.sh
autorestart=true
priority=50
