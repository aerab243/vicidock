; VICIdock — réglages PHP requis par VICIdial (repris de l'installeur
; communautaire cité par ViciStack : uploads de listes/sons volumineux,
; scripts d'admin longs, short tags historiques).
; Le fuseau horaire est généré à chaque boot depuis $TZ
; dans /etc/php.d/99-vicidock-timezone.ini (voir entrypoint.sh).
error_reporting = E_ALL & ~E_NOTICE
memory_limit = 448M
short_open_tag = On
max_execution_time = 3330
max_input_time = 3360
post_max_size = 448M
upload_max_filesize = 442M
default_socket_timeout = 3360
max_input_vars = 50000
