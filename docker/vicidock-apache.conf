# VICIdock — durcissement Apache.
# - Pas de page d'accueil AlmaLinux (welcome.conf supprimé au build) :
#   la racine redirige vers VICIdial, le reste en 404.
# - Pas de listage de dossiers (Index of /vicidial...).
# - Fichiers sensibles jamais servis en HTTP (inclus côté serveur OK).
# - Banner et méthodes réduits au minimum.
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory "/var/www/html">
    Options -Indexes
    AllowOverride None
</Directory>

RedirectMatch ^/$ /vicidial/welcome.php

<FilesMatch "\.(inc|pl|txt|log|sql|bak|old|orig|save|swp|dist|in)$">
    Require all denied
</FilesMatch>
