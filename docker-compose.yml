services:
  vicidock:
    # Un tag = une version de VICIdial. Image publiée par la CI sur GHCR.
    image: ghcr.io/aerab243/vicidock:${VICIDOCK_TAG:-latest}
    container_name: vicidock
    # Build local (optionnel) : docker compose up -d --build
    build:
      context: .
      args:
        VICIDIAL_SVN_REV: ${VICIDIAL_SVN_REV:-HEAD}
    restart: unless-stopped
    privileged: true # requis pour le timing DAHDI d'Asterisk
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD manquant (voir .env)}
      MYSQL_CRON_PASSWORD: ${MYSQL_CRON_PASSWORD:?MYSQL_CRON_PASSWORD manquant (voir .env)}
      CUSTOM_PASSWORD: ${CUSTOM_PASSWORD:-custom1234}
      SERVER_IP: ${SERVER_IP:-127.0.0.1}
    ports:
      - "80:80"
      - "443:443"
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "10000-20000:10000-20000/udp"
    volumes:
      - mysql_data:/var/lib/mysql
      - recordings:/var/spool/asterisk/monitor

volumes:
  mysql_data:
  recordings:
